plugins {
	id 'base'
	id "com.diffplug.spotless"
	id "com.bmuschko.docker-remote-api" version "9.4.0"
}

def sptVersion = rootProject.ext.SPT_VERSION
def sptReleaseVersion = rootProject.ext.SPT_RELEASE_VERSION
def engineBuildMetadata = rootProject.ext.SPT_BUILD_METADATA

description = "Spt Bundle - Distribution assembly for all components"
group = "io.github.dell.spt"
version = sptVersion

ext {
	distDir = layout.buildDirectory.dir("dist").get().asFile.absolutePath
	sptJar = "spt.jar"
	sptReleaseVersion = sptReleaseVersion
}

repositories {
	mavenCentral()
}

// No longer need configurations since we're directly referencing shadow JARs

// Task to copy example scenarios
task copyScenarios(type: Copy) {
	group = 'distribution'
	description = 'Copies example scenarios to distribution'
	
	from("${rootDir}/core/spt-base/src/main/resources/example/scenario")
	into("${distDir}/scenarios")
}

// Task to assemble the distribution
task assembleDist {
	group = 'distribution'
	description = 'Assembles the Spt distribution with core and extensions'
	
	// Depend on all shadow JAR tasks
	dependsOn ':core:spt-base:shadowJar'
	dependsOn ':extensions:load-steps:pipeline:shadowJar'
	dependsOn ':extensions:load-steps:weighted:shadowJar'
	dependsOn ':extensions:load-steps:mixed:shadowJar'
	dependsOn ':extensions:storage-drivers:primitives:coop:shadowJar'
	dependsOn ':extensions:storage-drivers:primitives:netty:shadowJar'
	dependsOn ':extensions:storage-drivers:primitives:nio:shadowJar'
	dependsOn ':extensions:storage-drivers:protocols:http:shadowJar'
	dependsOn ':extensions:storage-drivers:protocols:fs:shadowJar'
	dependsOn ':extensions:storage-drivers:implementations:atmos:shadowJar'
	dependsOn ':extensions:storage-drivers:implementations:s3:shadowJar'
	dependsOn ':extensions:storage-drivers:implementations:swift:shadowJar'
	dependsOn ':extensions:storage-drivers:implementations:s3-rdma:shadowJar'
	dependsOn ':extensions:storage-drivers:implementations:s3-tables:shadowJar'
	dependsOn ':extensions:storage-drivers:implementations:s3-aws:shadowJar'
	
	finalizedBy copyScenarios
	
	// Capture project references at configuration time
	def coreProject = project(':core:spt-base')
	def extensionProjectsMap = [
		':extensions:load-steps:pipeline': project(':extensions:load-steps:pipeline'),
		':extensions:load-steps:weighted': project(':extensions:load-steps:weighted'),
		':extensions:load-steps:mixed': project(':extensions:load-steps:mixed'),
		':extensions:storage-drivers:primitives:coop': project(':extensions:storage-drivers:primitives:coop'),
		':extensions:storage-drivers:primitives:netty': project(':extensions:storage-drivers:primitives:netty'),
		':extensions:storage-drivers:primitives:nio': project(':extensions:storage-drivers:primitives:nio'),
		':extensions:storage-drivers:protocols:http': project(':extensions:storage-drivers:protocols:http'),
		':extensions:storage-drivers:protocols:fs': project(':extensions:storage-drivers:protocols:fs'),
		':extensions:storage-drivers:implementations:atmos': project(':extensions:storage-drivers:implementations:atmos'),
		':extensions:storage-drivers:implementations:s3': project(':extensions:storage-drivers:implementations:s3'),
		':extensions:storage-drivers:implementations:swift': project(':extensions:storage-drivers:implementations:swift'),
		':extensions:storage-drivers:implementations:s3-rdma': project(':extensions:storage-drivers:implementations:s3-rdma'),
		':extensions:storage-drivers:implementations:s3-tables': project(':extensions:storage-drivers:implementations:s3-tables'),
		':extensions:storage-drivers:implementations:s3-aws': project(':extensions:storage-drivers:implementations:s3-aws')
	]
	
	doLast {
		// Create distribution directory
		file(distDir).mkdirs()
		file("${distDir}/ext").mkdirs()
		
		// Copy README template with version placeholder expansion
		def readmeTemplate = file("${projectDir}/src/distribution/README.txt")
		if (readmeTemplate.exists()) {
			copy {
				from readmeTemplate
				into distDir
				expand(version: sptReleaseVersion)
				filteringCharset = "UTF-8"
			}
		}
		
		// Copy core shadow JAR as spt.jar
		def coreJar = fileTree("${coreProject.buildDir}/libs").include("*-all.jar").singleFile
		copy {
			from coreJar
			into distDir
			rename { sptJar }
		}
		
		// Copy all extension shadow JARs to ext/ subdirectory
		extensionProjectsMap.each { extName, extProject ->
			def shadowJar = fileTree("${extProject.buildDir}/libs").include("*-all.jar").singleFile
			copy {
				from shadowJar
				into "${distDir}/ext"
			}
		}
		
		println "Distribution assembled in: ${distDir}"
		println "Main JAR: ${sptJar}"
		println "Extensions in: ext/"
		
		// List what was copied
		fileTree(distDir).visit { FileVisitDetails details ->
			if (!details.directory) {
				println "  ${details.relativePath}"
			}
		}
	}
}

// The SPT image defines the engine's default JVM options: the X86_JAVA_OPTS and DEFAULT_JAVA_OPTS
// lines of docker/entrypoint.sh, and the Dockerfile's GLIBC_TUNABLES. createRunScript generates
// run.sh and run.bat from them, and verifyLauncherJavaOptions checks the launchers against the image.
def imageEntrypoint = layout.projectDirectory.file('docker/entrypoint.sh')
def imageDockerfile = layout.projectDirectory.file('Dockerfile')
// The image's one Java-version-conditional option. The launchers leave it out: Java 21 refuses it.
def launcherOmittedJavaOption = '-XX:+UseCompactObjectHeaders'
// Where DEFAULT_JAVA_OPTS places the x86-only options. The image passes them on x86_64, and the
// launchers when the java they run accepts them.
def imageX86JavaOptsReference = '${X86_JAVA_OPTS}'

def readImageJavaOptions = {
	def entrypoint = imageEntrypoint.asFile
	def dockerfile = imageDockerfile.asFile
	// Each value goes into a bash double-quoted string and a cmd "set", so only option characters pass.
	def optionToken = ~/-[\w:+=.,\/-]+/
	def oneValue = { File source, String what, String linePattern ->
		def lines = source.readLines('UTF-8').findAll { it ==~ linePattern }
		if (lines.size() != 1) {
			throw new GradleException("${source}: expected one ${what} line, found ${lines.size()}")
		}
		return (lines[0] =~ linePattern)[0][1] as String
	}
	def tokens = { File source, String what, String value, List<String> references ->
		def list = value.trim().split(/\s+/).findAll { it } as List<String>
		def bad = list.findAll { !(it ==~ optionToken) && !references.contains(it) }
		if (list.isEmpty() || bad) {
			throw new GradleException("${source}: ${what} must be options separated by spaces; cannot read ${bad}")
		}
		return list
	}

	def entrypointLines = entrypoint.readLines('UTF-8')
	if (entrypointLines.count { it.trim().startsWith('DEFAULT_JAVA_OPTS=') } != 1) {
		throw new GradleException("${entrypoint}: DEFAULT_JAVA_OPTS must be assigned on one line")
	}
	def x86 = tokens(entrypoint, 'X86_JAVA_OPTS',
		oneValue(entrypoint, 'x86_64) X86_JAVA_OPTS="..." ;;', /\s*x86_64\)\s+X86_JAVA_OPTS="([^"]*)"\s*;;\s*/), [])
	def defaults = tokens(entrypoint, 'DEFAULT_JAVA_OPTS',
		oneValue(entrypoint, 'DEFAULT_JAVA_OPTS="..."', /DEFAULT_JAVA_OPTS="([^"]*)"/), [imageX86JavaOptsReference])
	[imageX86JavaOptsReference, launcherOmittedJavaOption].each { required ->
		if (defaults.count(required) != 1) {
			throw new GradleException("${entrypoint}: DEFAULT_JAVA_OPTS must contain ${required} once")
		}
	}
	if (dockerfile.readLines('UTF-8').count { it ==~ /\s*ENV\s+GLIBC_TUNABLES\b.*/ } != 1) {
		throw new GradleException("${dockerfile}: GLIBC_TUNABLES must be set on one ENV line")
	}
	def glibcTunables = oneValue(dockerfile, 'ENV GLIBC_TUNABLES=...', /ENV GLIBC_TUNABLES=([\w.=:]+)/)
	return [x86JavaOptions: x86, defaultJavaOptions: defaults, glibcTunables: glibcTunables]
}

// The image's default options on a machine with (x86 true) or without the x86-only options.
def imageJavaOptions = { Map image, boolean x86 ->
	image.defaultJavaOptions.collectMany { it == imageX86JavaOptsReference ? (x86 ? image.x86JavaOptions : []) : [it] }
}

// The launchers' default options, with x86Reference where the image places the x86-only options.
def launcherJavaOptions = { Map image, String x86Reference ->
	image.defaultJavaOptions.findAll { it != launcherOmittedJavaOption }
		.collect { it == imageX86JavaOptsReference ? x86Reference : it }
}

// Task to create the run scripts
task createRunScript {
	group = 'distribution'
	description = 'Generates run.sh and run.bat with the default JVM options of the SPT image'
	dependsOn assembleDist
	def outputDir = layout.buildDirectory.dir("dist").get().asFile
	inputs.files(imageEntrypoint, imageDockerfile)
	outputs.files(new File(outputDir, 'run.sh'), new File(outputDir, 'run.bat'))

	doLast {
		def image = readImageJavaOptions()
		def x86Options = image.x86JavaOptions.join(' ')

		def scriptFile = new File(outputDir, "run.sh")
		scriptFile.text = '''#!/bin/bash
# Spt run script
#
# Starts the engine with the default JVM options of the SPT image, which are listed below, with
# two differences:
# - The image also passes -XX:+UseCompactObjectHeaders, which this script leaves out: Java 21
#   refuses it.
# - -XX:UseAVX=2 exists only on x86 JVMs, and an arm64 JVM refuses it and doesn't start. This
#   script passes it only when the java on PATH accepts it.
# The engine needs Java 21 or later; the image runs Java 25.
#
# Default JVM options:
# - ZGC: sub-millisecond GC pauses; avoids GC jitter in latency measurements
# - Xms 1g, Xmx 4g: bounded heap for Java objects (GC works best with a defined ceiling)
# - MaxDirectMemorySize 64g: separate ceiling for off-heap ByteBuffers (RDMA/NIO);
#   allocated on demand so this limit is safe even on smaller machines
# - AlwaysPreTouch: pre-fault heap pages at startup to eliminate page faults during runs
# - UseNUMA: NUMA-aware allocation for multi-socket servers
# - Xshare:off: disable CDS to prevent SIGBUS when JDK/JAR resides on NFS
# - UseAVX=2 (x86 JVMs only): avoid AVX-512 EVEX glibc code paths with known SIGBUS crashes
# - DoJVMTIVirtualThreadTransitions: skip JVMTI mount/unmount notifications on every
#   VirtualThread context switch; reduces per-op overhead when no debugging agent is attached
# - sun.rmi.transport.tcp.responseTimeout: bounds how long the entry node's socket read
#   waits for a reply to a distributed-coordination RMI call. Defaults to 0 (wait forever)
#   in the JDK; without this, a transient network stall on the RMI connection hangs the
#   whole run indefinitely instead of failing fast into the existing retry path.
#
# SPT_JAVA_OPTS adds options after the defaults, and when an option is given twice the JVM uses
# the later one. For example, SPT_JAVA_OPTS="-Xmx8g" ./run.sh ... runs with an 8 GiB heap and
# every other default. To pick another garbage collector, turn ZGC off first:
# SPT_JAVA_OPTS="-XX:-UseZGC -XX:+UseG1GC". A maximum heap below 1 GiB needs a matching -Xms.
# This script reads SPT_JAVA_OPTS, not JAVA_OPTS. To run without the defaults, start
# java <options> -jar spt.jar yourself.
#
# Unless GLIBC_TUNABLES is set, even to empty, this script sets it to @GLIBC_TUNABLES@,
# as the image does, to ask glibc's malloc for huge pages. glibc before 2.35 and musl ignore it.
#
# The script replaces itself with the JVM, so a signal sent to its process reaches the engine.

# Get the directory where this script is located
SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"

# Ask the java below, without the caller's JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS and _JAVA_OPTIONS,
# whether it accepts the x86-only options.
SPT_X86_JAVA_OPTS=""
if (unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS; java @X86_JAVA_OPTS@ -version) >/dev/null 2>&1; then
	SPT_X86_JAVA_OPTS="@X86_JAVA_OPTS@"
fi
SPT_DEFAULT_JAVA_OPTS="@DEFAULT_JAVA_OPTS@"

export GLIBC_TUNABLES="${GLIBC_TUNABLES-@GLIBC_TUNABLES@}"

# Run Spt with all arguments passed to this script
# shellcheck disable=SC2086 # the option variables are lists of options
exec java $SPT_DEFAULT_JAVA_OPTS $SPT_JAVA_OPTS -jar "$SCRIPT_DIR/spt.jar" "$@"
'''
			.replace('@DEFAULT_JAVA_OPTS@', launcherJavaOptions(image, '${SPT_X86_JAVA_OPTS}').join(' '))
			.replace('@X86_JAVA_OPTS@', x86Options)
			.replace('@GLIBC_TUNABLES@', image.glibcTunables)
		scriptFile.setExecutable(true)

		// Also create a Windows batch file. cmd reads it with CRLF line endings; it has no labels
		// or blocks, and java is its last command, so java's exit code is the script's.
		def batchFile = new File(outputDir, "run.bat")
		def batchText = '''@echo off
rem Spt run script for Windows
rem
rem Starts the engine with the default JVM options of the SPT image, as run.sh does. The image
rem also passes -XX:+UseCompactObjectHeaders, which this script leaves out: Java 21 refuses it.
rem -XX:UseAVX=2 exists only on x86 JVMs: this script passes it only when the java on PATH
rem accepts it. The engine needs Java 21 or later; the image runs Java 25.
rem
rem SPT_JAVA_OPTS adds options after the defaults, and when an option is given twice the JVM
rem uses the later one, for example: set SPT_JAVA_OPTS=-Xmx8g
rem To pick another garbage collector, turn ZGC off first:
rem set SPT_JAVA_OPTS=-XX:-UseZGC -XX:+UseG1GC
setlocal

rem Get the directory where this script is located
set "SCRIPT_DIR=%~dp0"

rem Ask the java below, without the caller's JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS and
rem _JAVA_OPTIONS, whether it accepts the x86-only options. call returns here when java is a
rem batch file, such as a version manager's shim.
setlocal
set "JAVA_TOOL_OPTIONS="
set "JDK_JAVA_OPTIONS="
set "_JAVA_OPTIONS="
set "SPT_X86_JAVA_OPTS="
call java @X86_JAVA_OPTS@ -version >nul 2>&1 && set "SPT_X86_JAVA_OPTS=@X86_JAVA_OPTS@"
endlocal & set "SPT_X86_JAVA_OPTS=%SPT_X86_JAVA_OPTS%"
set "SPT_DEFAULT_JAVA_OPTS=@DEFAULT_JAVA_OPTS@"

rem Run Spt with all arguments passed to this script
java %SPT_DEFAULT_JAVA_OPTS% %SPT_JAVA_OPTS% -jar "%SCRIPT_DIR%spt.jar" %*
'''
			.replace('@DEFAULT_JAVA_OPTS@', launcherJavaOptions(image, '%SPT_X86_JAVA_OPTS%').join(' '))
			.replace('@X86_JAVA_OPTS@', x86Options)
		batchFile.setText(batchText.replace('\n', '\r\n'), 'US-ASCII')
	}
}

// Task to create ZIP distribution
task distZip(type: Zip) {
	group = 'distribution'
	description = 'Creates a ZIP distribution of Spt'
	
	dependsOn assembleDist, createRunScript, copyScenarios
	
	archiveBaseName = 'spt-bundle'
	archiveVersion = project.version
	archiveExtension = 'zip'
	destinationDirectory = file("${buildDir}/distributions")
	
	from(distDir) {
		into "spt-${project.version}"
	}
}

// Task to create launch.json for VS Code
task createVSCodeLaunch {
	group = 'ide'
	description = 'Creates VS Code launch configuration'
	
	doLast {
		def vscodeDir = file("${rootDir}/.vscode")
		vscodeDir.mkdirs()
		
		def launchFile = file("${vscodeDir}/launch.json")
		launchFile.text = """{
	"version": "0.2.0",
	"configurations": [
		{
			"type": "java",
			"name": "Debug Spt",
			"request": "launch",
			"mainClass": "com.dell.spt.base.Main",
			"projectName": "spt-base",
			"args": "--help",
			"cwd": "\${workspaceFolder}/bundle/build/dist",
			"classPaths": [
				"\${workspaceFolder}/bundle/build/dist/spt.jar",
				"\${workspaceFolder}/bundle/build/dist/ext/*"
			]
		},
		{
			"type": "java",
			"name": "Run Spt (S3 Test)",
			"request": "launch",
			"mainClass": "com.dell.spt.base.Main",
			"projectName": "spt-base",
			"args": [
				"--storage-driver-type=s3",
				"--storage-net-node-addrs=localhost:9000",
				"--storage-auth-uid=minioadmin",
				"--storage-auth-secret=minioadmin",
				"--item-data-size=1MB",
				"--load-op-limit-count=100"
			],
			"cwd": "\${workspaceFolder}/bundle/build/dist"
		}
	]
}"""
		println "Created VS Code launch configuration at: ${launchFile}"
	}
}

def directJarScenarioSpecs = [
	[
		name: 'seed',
		source: file("${rootDir}/core/spt-base/doc/usage/input/scenarios/s3_integrity_seed.js"),
		runCallCount: 1,
	],
	[
		name: 'write-verify',
		source: file("${rootDir}/core/spt-base/doc/usage/input/scenarios/s3_integrity_write_verify.js"),
		runCallCount: 2,
	],
	[
		name: 'read-verify',
		source: file("${rootDir}/core/spt-base/doc/usage/input/scenarios/s3_integrity_read_verify.js"),
		runCallCount: 1,
	],
]

def engineBuildInfoDocumentation = [
	[
		file: file("${rootDir}/README.md"),
		required: 'same immutable Engine Build Information snapshot used by startup reporting',
	],
	[
		file: file("${rootDir}/core/spt-base/doc/usage/input/cli/README.md"),
		required: '`--run-version` is retained only as a compatibility option',
	],
	[
		file: file("${rootDir}/core/spt-base/doc/usage/input/configuration/README.md"),
		required: 'projected from immutable Engine Build Information after configuration merging',
	],
	[
		file: file("${rootDir}/core/spt-base/doc/design/installer/README.md"),
		required: 'renders the startup banner from that snapshot',
	],
	[
		file: file("${rootDir}/core/spt-base/doc/usage/api/remote/README.md"),
		required: '`run.version` is projected from immutable Engine Build Information',
	],
]

tasks.register('verifyEngineBuildInfoDocumentation') {
	group = 'verification'
	description = 'Verifies engine version documentation keeps immutable build information authoritative'
	inputs.files(engineBuildInfoDocumentation.collect { it.file })

	doLast {
		engineBuildInfoDocumentation.each { contract ->
			def content = contract.file.getText('UTF-8')
			if (!content.contains(contract.required)) {
				throw new GradleException(
					"${contract.file} does not document the Engine Build Information authority contract")
			}
		}
	}
}

tasks.register('verifyDirectJarScenarioConfigs') {
	group = 'verification'
	description = 'Validates direct-JAR integrity scenarios through the packaged Nashorn and Confuse path'
	dependsOn assembleDist

	inputs.files(directJarScenarioSpecs.collect { it.source })
	inputs.file(file("${distDir}/${sptJar}"))
	inputs.dir(file("${distDir}/ext"))
	def probeRootProvider = layout.buildDirectory.dir('direct-jar-scenario-config')
	outputs.dir(probeRootProvider)

	doLast {
		def probeRoot = probeRootProvider.get().asFile
		delete probeRoot
		probeRoot.mkdirs()
		def javaExecutable = new File(
			System.getProperty('java.home'),
			'bin/java' + (System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : '')
		).absolutePath

		directJarScenarioSpecs.each { scenario ->
			def source = scenario.source.getText('UTF-8')
			def actualRunCallCount = source.count('.run();')
			if (actualRunCallCount != scenario.runCallCount) {
				throw new GradleException(
					"${scenario.name} scenario has ${actualRunCallCount} run calls; expected ${scenario.runCallCount}")
			}

			def marker = "DIRECT_JAR_${scenario.name.toUpperCase().replace('-', '_')}_CONFIG_OK"
			def probeFile = new File(probeRoot, "${scenario.name}-config-only.js")
			probeFile.setText(source.replace('.run();', ';') + "\nprint(\"${marker}\");\n", 'UTF-8')
			def scenarioHome = new File(probeRoot, scenario.name)
			def scenarioLog = new File(scenarioHome, 'log')

			def execution = providers.exec {
				workingDir distDir
				commandLine javaExecutable, '-jar', "${distDir}/${sptJar}", "--run-scenario=${probeFile.absolutePath}"
				environment(
					'SPT_HOME': scenarioHome.absolutePath,
					'SPT_LOG_DIR': scenarioLog.absolutePath,
					'S3_ENDPOINT': '127.0.0.1',
					'S3_PORT': '1',
					'S3_SSL_ENABLED': 'false',
					'S3_ACCESS_KEY': 'direct-jar-test',
					'S3_SECRET_KEY': 'direct-jar-test',
					'S3_BUCKET': 'direct-jar-test',
					'S3_REGION': 'us-east-1',
					'INTEGRITY_THREADS': '1',
					'INTEGRITY_COUNT': '1',
					'INTEGRITY_OBJECT_SIZE': '1KiB',
					'INTEGRITY_PREFIX': 'direct-jar-test/',
					'INTEGRITY_ITEMS_FILE': 'direct-jar-test.csv',
				)
				ignoreExitValue = true
			}
			def result = execution.result.get()
			def output = execution.standardOutput.asText.get() + execution.standardError.asText.get()
			if (result.exitValue != 0 || !output.contains(marker)) {
				throw new GradleException(
					"Packaged direct-JAR ${scenario.name} config validation failed (exit ${result.exitValue}):\n${output}")
			}
		}
	}
}

tasks.register('verifyEngineBuildInfoCanary') {
	group = 'verification'
	description = 'Verifies all packaged engine version surfaces use generated build information'
	dependsOn assembleDist

	inputs.file(file("${distDir}/${sptJar}"))
	inputs.dir(file("${distDir}/ext"))
	inputs.property("buildInformation", engineBuildMetadata.map { it.resourceValues() })
	def canaryRootProvider = layout.buildDirectory.dir('engine-build-info-canary')
	outputs.dir(canaryRootProvider)

	doLast {
		def canaryRoot = canaryRootProvider.get().asFile
		delete canaryRoot
		canaryRoot.mkdirs()
		def javaExecutable = new File(
			System.getProperty('java.home'),
			'bin/java' + (System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : '')
		).absolutePath
		def jarFile = file("${distDir}/${sptJar}")
		def expectedResource = engineBuildMetadata.get().resourceValues()

		def versionExecution = providers.exec {
			workingDir distDir
			commandLine javaExecutable, '-jar', jarFile.absolutePath, '--version'
			ignoreExitValue = true
		}
		def versionResult = versionExecution.result.get()
		def versionOutput = versionExecution.standardOutput.asText.get() + versionExecution.standardError.asText.get()
		def bannerMessage = " spt v ${expectedResource.version} "
		def bannerPadding = '#' * (120 - bannerMessage.length()).intdiv(2)
		def expectedBanner = bannerPadding + bannerMessage + bannerPadding
		def expectedVersionLines = [
			expectedBanner,
			"Engine build schema: ${expectedResource.schema_version}",
			"Engine product: ${expectedResource.product}",
			"Engine version: ${expectedResource.version}",
			"Engine revision: ${expectedResource.revision}",
			"Engine build time: ${expectedResource.build_time}",
			"Engine development: ${expectedResource.development}",
			"Engine source dirty: ${expectedResource.source_dirty}",
			'Java version: ',
			'Available extensions:',
		]
		if (versionResult.exitValue != 0 || !expectedVersionLines.every { versionOutput.contains(it) }) {
			throw new GradleException(
				"Packaged --version build-information canary failed (exit ${versionResult.exitValue}):\n${versionOutput}")
		}

		def scenarioHome = new File(canaryRoot, 'home')
		def scenarioLog = new File(canaryRoot, 'output')
		def scenarioFile = new File(canaryRoot, 'engine-build-info-canary.js')
		def effectiveVersionMarker = "ENGINE_EFFECTIVE_VERSION=${expectedResource.version}"
		scenarioFile.setText(
			"print('ENGINE_EFFECTIVE_VERSION=' + config.stringVal('run-version'));\nLoad.config({run: {version: '9.9.9'}}).append({run: {version: '8.8.8'}}).run();\n",
			'UTF-8')
		def scenarioExecution = providers.exec {
			workingDir distDir
			commandLine(
				javaExecutable,
				'-jar',
				jarFile.absolutePath,
				"--run-scenario=${scenarioFile.absolutePath}",
				'--storage-driver-type=netty-mock',
				'--storage-driver-limit-concurrency=1',
				'--item-data-size=1KiB',
				'--load-op-limit-count=1',
				'--load-step-id=engine-build-info-canary')
			environment(
				'SPT_HOME': scenarioHome.absolutePath,
				'SPT_LOG_DIR': scenarioLog.absolutePath,
			)
			ignoreExitValue = true
		}
		def scenarioResult = scenarioExecution.result.get()
		def scenarioOutput = scenarioExecution.standardOutput.asText.get() + scenarioExecution.standardError.asText.get()
		def startupMarker = "Engine build: ${expectedResource.version} (${expectedResource.revision.take(12)}"
		if (scenarioResult.exitValue != 0
				|| scenarioOutput.count(expectedBanner) != 1
				|| scenarioOutput.count('Engine build:') != 1
				|| !scenarioOutput.contains(startupMarker)
				|| scenarioOutput.count(effectiveVersionMarker) != 1) {
			throw new GradleException(
				"Packaged direct-scenario build-information canary failed (exit ${scenarioResult.exitValue}):\n${scenarioOutput}")
		}

		def logRoot = new File(scenarioLog, 'log')
		def stepArtifact = new File(logRoot, 'engine-build-info-canary/engine.build.json')
		def initializationArtifacts = fileTree(logRoot) {
			include 'none-*/engine.build.json'
		}.files
		if (!stepArtifact.isFile() || initializationArtifacts.size() != 1) {
			throw new GradleException(
				"Direct scenario did not produce initialization and workload Engine Build Records under ${logRoot}")
		}

		['config.yaml', 'metrics.total.csv'].each { name ->
			if (!new File(stepArtifact.parentFile, name).isFile()) {
				throw new GradleException("Packaged workload ${name} is not colocated with engine.build.json")
			}
		}

		def stepConfigText = new File(stepArtifact.parentFile, 'config.yaml').getText('UTF-8')
		if (!stepConfigText.readLines().contains('  version: "' + expectedResource.version + '"')
				|| stepConfigText.contains('9.9.9') || stepConfigText.contains('8.8.8')
				|| scenarioOutput.count('Configured run.version override is ignored') != 1) {
			throw new GradleException('Packaged scenario override bypassed engine version authority or one-shot warning')
		}

		def expectedJson = [
			schema_version: expectedResource.schema_version as Integer,
			product: expectedResource.product,
			version: expectedResource.version,
			revision: expectedResource.revision,
			build_time: expectedResource.build_time,
			development: expectedResource.development.toBoolean(),
			source_dirty: expectedResource.source_dirty == 'unknown'
				? null
				: expectedResource.source_dirty.toBoolean(),
		]
		def parser = new groovy.json.JsonSlurper()
		def records = [stepArtifact, initializationArtifacts.iterator().next()].collect {
			parser.parseText(it.getText('UTF-8'))
		}
		if (!records.every { it == expectedJson } || records[0] != records[1]) {
			throw new GradleException("Packaged direct-scenario Engine Build Records differ from generated metadata")
		}

		def reservePort = {
			def socket = new java.net.ServerSocket(0)
			try {
				return socket.localPort
			} finally {
				socket.close()
			}
		}
		def nodePort = reservePort()
		def nodeServicePort = reservePort()
		while (nodeServicePort == nodePort) {
			nodeServicePort = reservePort()
		}
		def nodeHome = new File(canaryRoot, 'node-home')
		def nodeLog = new File(canaryRoot, 'node-output')
		def nodeStdout = new File(canaryRoot, 'node.stdout.log')
		def nodeStderr = new File(canaryRoot, 'node.stderr.log')
		nodeHome.mkdirs()
		nodeLog.mkdirs()
		def nodeBuilder = new ProcessBuilder(
			javaExecutable,
			'-jar',
			jarFile.absolutePath,
			'--run-node',
			"--run-port=${nodePort}",
			"--load-step-node-port=${nodeServicePort}",
			'--api-linger-sec=0',
			'--storage-driver-type=netty-mock',
			'--storage-driver-limit-concurrency=1',
			'--item-data-size=1KiB',
			'--load-op-limit-count=1',
			'--load-step-id=engine-build-info-node-canary')
		nodeBuilder.directory(file(distDir))
		nodeBuilder.environment().put('SPT_HOME', nodeHome.absolutePath)
		nodeBuilder.environment().put('SPT_LOG_DIR', nodeLog.absolutePath)
		nodeBuilder.redirectOutput(nodeStdout)
		nodeBuilder.redirectError(nodeStderr)
		def nodeProcess = nodeBuilder.start()
		try {
			def versionBody = null
			def deadline = System.nanoTime() + java.time.Duration.ofSeconds(30).toNanos()
			while (versionBody == null && nodeProcess.isAlive() && System.nanoTime() < deadline) {
				try {
					def connection = (java.net.HttpURLConnection) new URL("http://127.0.0.1:${nodePort}/version").openConnection()
					connection.connectTimeout = 500
					connection.readTimeout = 1000
					if (connection.responseCode == 200) {
						versionBody = connection.inputStream.getText('UTF-8')
					}
					connection.disconnect()
				} catch (IOException ignored) {
					Thread.sleep(100)
				}
			}
			if (versionBody == null || parser.parseText(versionBody) != expectedJson) {
				throw new GradleException(
					"Packaged node /version differs from generated metadata:\n"
						+ nodeStdout.getText('UTF-8') + nodeStderr.getText('UTF-8'))
			}

			def request = { String path, String method, String scenario = null ->
				def connection = (java.net.HttpURLConnection) new URL("http://127.0.0.1:${nodePort}${path}").openConnection()
				connection.requestMethod = method
				connection.connectTimeout = 1000
				connection.readTimeout = 2000
				try {
					if (scenario != null) {
						def boundary = 'engine-build-info-canary'
						connection.doOutput = true
						connection.setRequestProperty('Content-Type', 'multipart/form-data; boundary=' + boundary)
						def multipart = "--${boundary}\r\nContent-Disposition: form-data; name=\"scenario\"; filename=\"scenario.js\"\r\nContent-Type: application/javascript\r\n\r\n${scenario}\r\n--${boundary}--\r\n"
						connection.outputStream.withCloseable { it.write(multipart.getBytes('UTF-8')) }
					}
					def status = connection.responseCode
					return [status: status, body: status == 200 ? connection.inputStream.getText('UTF-8') : '']
				} finally {
					connection.disconnect()
				}
			}
			if (request('/run', 'POST', "Load.config({run: {version: '9.9.9'}}).append({run: {version: '8.8.8'}}).run();").status != 202) {
				throw new GradleException('Packaged node workload was not accepted')
			}
			deadline = System.nanoTime() + java.time.Duration.ofSeconds(20).toNanos()
			def completed = false
			while (!completed && nodeProcess.isAlive() && System.nanoTime() < deadline) {
				completed = parser.parseText(request('/status', 'GET').body).state == 'COMPLETED'
				if (!completed) Thread.sleep(100)
			}
			if (!completed) throw new GradleException('Packaged node workload did not complete')
			def logsPath = '/logs/engine-build-info-node-canary/'
			def buildResponse = request(logsPath + 'engine.build.json', 'GET')
			if (buildResponse.status != 200 || parser.parseText(buildResponse.body) != expectedJson) {
				throw new GradleException('Packaged node logs cannot serve the identical Engine Build Record')
			}
			def indexResponse = request(logsPath + 'index.json', 'GET')
			if (indexResponse.status != 200 || !parser.parseText(indexResponse.body).items.any { it.logger == 'engine.build.json' }) {
				throw new GradleException('Packaged node logs index omits Engine Build Record')
			}
			['config.yaml', 'metrics.total.csv', 'engine.build.json'].each { name ->
				if (!new File(nodeLog, "log/engine-build-info-node-canary/${name}").isFile()) {
					throw new GradleException("Packaged node ${name} is not under the configured log root")
				}
			}

			def nodeConfig = request(logsPath + 'Config', 'GET')
			if (nodeConfig.status != 200 || !nodeConfig.body.readLines().contains('  version: "' + expectedResource.version + '"')
					|| nodeConfig.body.contains('9.9.9') || nodeConfig.body.contains('8.8.8')) {
				throw new GradleException('Packaged Control API scenario bypassed engine version authority')
			}

			def shutdownConnection = (java.net.HttpURLConnection) new URL(
				"http://127.0.0.1:${nodePort}/shutdown").openConnection()
			shutdownConnection.requestMethod = 'POST'
			shutdownConnection.connectTimeout = 1000
			shutdownConnection.readTimeout = 1000
			if (shutdownConnection.responseCode != 202) {
				throw new GradleException("Packaged node shutdown was not accepted")
			}
			shutdownConnection.disconnect()
			if (!nodeProcess.waitFor(20, java.util.concurrent.TimeUnit.SECONDS)) {
				throw new GradleException("Packaged node did not stop after the canary")
			}
			def nodeOutput = nodeStdout.getText('UTF-8') + nodeStderr.getText('UTF-8')
			if (nodeProcess.exitValue() != 0
					|| nodeOutput.count(expectedBanner) != 1
					|| nodeOutput.count('Engine build:') != 1
					|| nodeOutput.count('Configured run.version override is ignored') != 1
					|| !nodeOutput.contains(startupMarker)) {
				throw new GradleException("Packaged node banner/startup build information differs from generated metadata:\n${nodeOutput}")
			}
		} finally {
			if (nodeProcess.isAlive()) {
				nodeProcess.destroy()
				if (!nodeProcess.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)) {
					nodeProcess.destroyForcibly()
				}
			}
		}
	}
}

tasks.register('verifyImageMallocTunable') {
	group = 'verification'
	description = 'Checks that the image keeps the malloc setting RDMA pre-warm depends on'
	def dockerfile = layout.projectDirectory.file('Dockerfile')
	inputs.file(dockerfile)
	doLast {
		def expected = 'ENV GLIBC_TUNABLES=glibc.malloc.hugetlb=1'
		if (!dockerfile.asFile.readLines().any { it.trim() == expected }) {
			throw new GradleException("engine/bundle/Dockerfile no longer sets '${expected}'; see cli/docs/S3_RDMA.md, Pre-warm")
		}
	}
}

// Runs the generated run.sh and the image's entrypoint with a stub java first on PATH, and compares
// the options and environment each gives the JVM. run.sh may differ from the image only in leaving
// out launcherOmittedJavaOption and in passing the x86-only options to a JVM that accepts them.
// run.bat can't run here, so its option line and shape are read instead.
tasks.register('verifyLauncherJavaOptions') {
	group = 'verification'
	description = 'Checks that run.sh and run.bat start the JVM with the default options of the SPT image'
	dependsOn createRunScript
	def runScript = file("${distDir}/run.sh")
	def batchScript = file("${distDir}/run.bat")
	inputs.files(runScript, batchScript, imageEntrypoint, imageDockerfile)
	def workRootProvider = layout.buildDirectory.dir('launcher-java-options')
	onlyIf('run.sh and the entrypoint need a POSIX shell') {
		!System.getProperty('os.name').toLowerCase().contains('win')
	}

	doLast {
		def image = readImageJavaOptions()
		def workRoot = workRootProvider.get().asFile
		delete workRoot
		def stubDir = new File(workRoot, 'bin')
		stubDir.mkdirs()
		def stubJava = new File(stubDir, 'java')
		stubJava.setText('''#!/bin/sh
# Stub java: records its arguments and environment. A call ending in -version is the launcher's
# probe, which succeeds when STUB_JAVA_X86=accept and none of the JVM's option variables is set.
out="${STUB_JAVA_OUT:?}"
last=""
for arg in "$@"; do last="$arg"; done
if [ "$last" = -version ]; then
	echo probe >> "$out/probe.calls"
	env > "$out/probe.env"
	if [ "${STUB_JAVA_X86:-}" = accept ] && [ -z "${JAVA_TOOL_OPTIONS+x}${JDK_JAVA_OPTIONS+x}${_JAVA_OPTIONS+x}" ]; then
		exit 0
	fi
	echo "Unrecognized VM option '$1'" >&2
	exit 1
fi
printf '%s\\n' "$@" > "$out/launch.args"
env > "$out/launch.env"
if [ "${STUB_JAVA_WAIT:-}" = 1 ]; then
	trap 'echo TERM > "$out/signal"; exit 143' TERM
	echo "$$" > "$out/launch.pid.tmp" && mv "$out/launch.pid.tmp" "$out/launch.pid"
	# Waits at most 60 s, so a stub the test can't stop doesn't run on.
	waited=0
	while [ "$waited" -lt 60 ]; do
		sleep 1 </dev/null >/dev/null 2>&1 &
		wait $!
		waited=$((waited + 1))
	done
	exit 124
fi
exit "${STUB_JAVA_EXIT:-0}"
''', 'UTF-8')
		stubJava.setExecutable(true)
		def stubUname = new File(stubDir, 'uname')
		stubUname.setText('''#!/bin/sh
# Stub uname: answers -m with STUB_UNAME_M.
[ "${1:-}" = -m ] && echo "${STUB_UNAME_M:?}"
''', 'UTF-8')
		stubUname.setExecutable(true)

		def problems = []
		def caseNumber = 0
		def start = { String name, List<String> command, Map<String, String> env, File pathFirst = stubDir ->
			def out = new File(workRoot, "${++caseNumber}-${name}")
			out.mkdirs()
			def builder = new ProcessBuilder(command)
			builder.directory(out)
			builder.environment().clear()
			builder.environment().putAll([
				PATH: pathFirst.absolutePath + File.pathSeparator + System.getenv('PATH'),
				STUB_JAVA_OUT: out.absolutePath,
				STUB_UNAME_M: 'x86_64',
			])
			builder.environment().putAll(env)
			builder.redirectErrorStream(true)
			builder.redirectOutput(new File(out, 'output.log'))
			return [name: name, process: builder.start(), out: out, inputEnv: new TreeMap(builder.environment())]
		}
		def lines = { File out, String file ->
			def f = new File(out, file)
			f.isFile() ? f.readLines('UTF-8') : null
		}
		def environment = { File out, String file ->
			def entries = lines(out, file)
			entries == null ? null : entries.findAll { it.indexOf('=') > 0 }.collectEntries {
				[(it.substring(0, it.indexOf('='))): it.substring(it.indexOf('=') + 1)]
			}
		}
		def finish = { Map started ->
			def process = started.process
			if (!process.waitFor(60, java.util.concurrent.TimeUnit.SECONDS)) {
				process.destroyForcibly()
				throw new GradleException("${started.name}: did not finish in 60 s")
			}
			return started + [
				exit: process.exitValue(),
				output: new File(started.out, 'output.log').getText('UTF-8'),
				args: lines(started.out, 'launch.args'),
				env: environment(started.out, 'launch.env'),
				probeCalls: lines(started.out, 'probe.calls')?.size() ?: 0,
				probeEnv: environment(started.out, 'probe.env'),
			]
		}
		def run = { String name, List<String> command, Map<String, String> env ->
			finish(start(name, command, env))
		}
		def options = { Map result, List<String> tail ->
			def args = result.args
			if (args == null) {
				problems << "${result.name}: java was not started (exit ${result.exit}):\n${result.output}"
				return null
			}
			if (args.size() < tail.size() || args.subList(args.size() - tail.size(), args.size()) != tail) {
				problems << "${result.name}: java's arguments don't end with ${tail}: ${args}"
				return null
			}
			return args.subList(0, args.size() - tail.size())
		}

		// The image: the entrypoint on x86_64 and on aarch64, against what build.gradle read from it.
		def imageTail = ['-jar', '/opt/spt/spt.jar', '--version']
		[x86_64: true, aarch64: false].each { machine, x86 ->
			def result = run("entrypoint-${machine}", ['sh', imageEntrypoint.asFile.absolutePath, '--version'],
				[STUB_UNAME_M: machine])
			def got = options(result, imageTail)
			if (got != null && got != imageJavaOptions(image, x86)) {
				problems << "the entrypoint on ${machine} passes ${got}, not the options build.gradle reads from it, " +
					"${imageJavaOptions(image, x86)}; keep every default option in its DEFAULT_JAVA_OPTS or X86_JAVA_OPTS line"
			}
		}

		// run.sh, with a stub java that accepts or refuses the x86-only options.
		def runScriptTail = ['-jar', runScript.parentFile.absolutePath + '/' + sptJar, '--version']
		def probeNoise = [
			JAVA_TOOL_OPTIONS: '-XX:+LauncherProbeNoise',
			JDK_JAVA_OPTIONS: '-XX:+LauncherProbeNoise',
			_JAVA_OPTIONS: '-XX:+LauncherProbeNoise',
		]
		def shellVariables = ['PWD', 'OLDPWD', 'SHLVL', '_'] as Set
		def checkRunScript = { String name, Map<String, String> env, List<String> expected, String expectedTunables ->
			def result = run(name, [runScript.absolutePath, '--version'], env)
			def got = options(result, runScriptTail)
			if (got != null && got != expected) {
				problems << "${name}: run.sh passes ${got}; expected ${expected}"
			}
			if (result.env != null) {
				def tunables = result.env.containsKey('GLIBC_TUNABLES') ? result.env.GLIBC_TUNABLES : null
				if (tunables != expectedTunables) {
					problems << "${name}: GLIBC_TUNABLES reaches java as ${tunables == null ? 'unset' : "'${tunables}'"}; " +
						"expected ${expectedTunables == null ? 'unset' : "'${expectedTunables}'"}"
				}
				def changed = result.inputEnv.findAll { key, value -> !shellVariables.contains(key) && result.env[key] != value }
				def added = result.env.keySet() - result.inputEnv.keySet() - shellVariables - ['GLIBC_TUNABLES']
				if (changed || added) {
					problems << "${name}: run.sh changes java's environment: changed ${changed.keySet()}, added ${added}"
				}
			}
			if (result.probeCalls != 1) {
				problems << "${name}: run.sh probed java ${result.probeCalls} times; expected once"
			} else {
				def leaked = probeNoise.keySet().findAll { result.probeEnv.containsKey(it) }
				if (leaked) {
					problems << "${name}: run.sh's probe ran with ${leaked} set"
				}
			}
			return result
		}
		def accepting = imageJavaOptions(image, true).findAll { it != launcherOmittedJavaOption }
		def refusing = imageJavaOptions(image, false).findAll { it != launcherOmittedJavaOption }
		def imageTunables = image.glibcTunables
		// uname answers aarch64 when the JVM accepts the options and x86_64 when it refuses them:
		// run.sh asks the JVM, not the machine.
		checkRunScript('accepting-jvm', probeNoise + [STUB_JAVA_X86: 'accept', STUB_UNAME_M: 'aarch64'], accepting, imageTunables)
		checkRunScript('refusing-jvm', probeNoise + [STUB_JAVA_X86: 'refuse'], refusing, imageTunables)
		def accept = [STUB_JAVA_X86: 'accept']
		checkRunScript('empty-spt-java-opts', accept + [SPT_JAVA_OPTS: ''], accepting, imageTunables)
		checkRunScript('added-option', accept + [SPT_JAVA_OPTS: '-Xmx8g'], accepting + ['-Xmx8g'], imageTunables)
		checkRunScript('overridden-defaults', accept + [SPT_JAVA_OPTS: '-XX:MaxDirectMemorySize=128g  -Xms2g'],
			accepting + ['-XX:MaxDirectMemorySize=128g', '-Xms2g'], imageTunables)
		checkRunScript('empty-glibc-tunables', accept + [GLIBC_TUNABLES: ''], accepting, '')
		checkRunScript('callers-glibc-tunables', accept + [GLIBC_TUNABLES: 'glibc.malloc.arena_max=2'], accepting,
			'glibc.malloc.arena_max=2')
		def failing = checkRunScript('exit-status', accept + [STUB_JAVA_EXIT: '37'], accepting, imageTunables)
		if (failing.exit != 37) {
			problems << "exit-status: run.sh exits ${failing.exit} where java exits 37"
		}

		// run.sh replaces itself with java: java has its PID, and a SIGTERM sent to it reaches java.
		def waiting = start('sigterm', [runScript.absolutePath, '--version'], accept + [STUB_JAVA_WAIT: '1'])
		try {
			def pidFile = new File(waiting.out, 'launch.pid')
			def deadline = System.nanoTime() + java.time.Duration.ofSeconds(30).toNanos()
			while (!pidFile.isFile() && waiting.process.isAlive() && System.nanoTime() < deadline) {
				Thread.sleep(20)
			}
			if (!pidFile.isFile()) {
				problems << "sigterm: java did not start:\n${new File(waiting.out, 'output.log').getText('UTF-8')}"
			} else if (pidFile.text.trim() != waiting.process.pid().toString()) {
				problems << "sigterm: java runs as PID ${pidFile.text.trim()}, not as run.sh's PID ${waiting.process.pid()}"
			} else {
				waiting.process.destroy()
				def stopped = finish(waiting)
				if (!new File(waiting.out, 'signal').isFile() || stopped.exit != 143) {
					problems << "sigterm: a SIGTERM sent to run.sh didn't stop java (exit ${stopped.exit})"
				}
			}
		} finally {
			if (waiting.process.isAlive()) {
				waiting.process.destroyForcibly()
			}
			// Without exec, java is run.sh's child and outlives it, so stop it by the PID it wrote.
			// The command line check keeps a PID that another process has reused untouched.
			def pidFile = new File(waiting.out, 'launch.pid')
			if (pidFile.isFile() && pidFile.text.trim().isLong()) {
				ProcessHandle.of(pidFile.text.trim() as long)
					.filter { it.info().commandLine().map { line -> line.contains(stubJava.absolutePath) }.orElse(false) }
					.ifPresent { it.destroyForcibly() }
			}
		}

		// run.sh on the JVM running this build (Java 21 in CI).
		def buildJavaBin = new File(System.getProperty('java.home'), 'bin')
		def real = finish(start('build-jvm', [runScript.absolutePath, '--version'],
			[HOME: System.getProperty('user.home')], buildJavaBin))
		if (real.exit != 0 || !real.output.contains('Engine version: ')) {
			problems << "build-jvm: run.sh --version on ${System.getProperty('java.version')} exits ${real.exit}:\n${real.output}"
		}

		// run.bat: CRLF lines, setlocal, no labels or blocks, the defaults in their own variable,
		// and the java line last.
		def batchBytes = batchScript.bytes
		def batchText = new String(batchBytes, 'US-ASCII')
		if (batchBytes.any { it < 0 } || batchText.replace('\r\n', '').contains('\n') || batchText.replace('\r\n', '').contains('\r')
				|| !batchText.endsWith('\r\n')) {
			problems << "run.bat must be ASCII with CRLF line endings"
		}
		def commands = batchText.split('\r\n').collect { it.trim() }.findAll { it && !(it ==~ /(?i)rem(\s.*)?/) }
		if (commands.take(2) != ['@echo off', 'setlocal']) {
			problems << "run.bat must start with @echo off and setlocal: ${commands.take(2)}"
		}
		def blocked = commands.findAll { it.startsWith(':') || it.contains('(') || it.contains(')') || it ==~ /(?i).*\bgoto\b.*/ }
		if (blocked) {
			problems << "run.bat has labels or blocks: ${blocked}"
		}
		def assignsUserOptions = commands.findAll { it ==~ /(?i)set\s+"?SPT_JAVA_OPTS=.*/ }
		if (assignsUserOptions) {
			problems << "run.bat assigns SPT_JAVA_OPTS: ${assignsUserOptions}"
		}
		def defaultsPrefix = 'set "SPT_DEFAULT_JAVA_OPTS='
		def defaultsLines = commands.findAll { it.startsWith(defaultsPrefix) }
		def batchDefaults = defaultsLines.size() == 1 && defaultsLines[0].endsWith('"')
			? defaultsLines[0].substring(defaultsPrefix.length(), defaultsLines[0].length() - 1).split(/\s+/) as List
			: null
		def expectedBatchDefaults = launcherJavaOptions(image, '%SPT_X86_JAVA_OPTS%')
		if (batchDefaults != expectedBatchDefaults) {
			problems << "run.bat's defaults ${defaultsLines} are not ${expectedBatchDefaults}"
		}
		// The probe runs with call, so a java that is a batch file returns, in a nested setlocal
		// that clears the caller's JVM option variables, and hands only its answer back.
		def x86 = image.x86JavaOptions.join(' ')
		def probe = [
			'setlocal',
			'set "JAVA_TOOL_OPTIONS="',
			'set "JDK_JAVA_OPTIONS="',
			'set "_JAVA_OPTIONS="',
			'set "SPT_X86_JAVA_OPTS="',
			"call java ${x86} -version >nul 2>&1 && set \"SPT_X86_JAVA_OPTS=${x86}\"".toString(),
			'endlocal & set "SPT_X86_JAVA_OPTS=%SPT_X86_JAVA_OPTS%"',
		]
		if (Collections.indexOfSubList(commands, probe) < 0) {
			problems << "run.bat doesn't probe java for ${x86} in its own setlocal: ${probe}"
		}
		def launch = 'java %SPT_DEFAULT_JAVA_OPTS% %SPT_JAVA_OPTS% -jar "%SCRIPT_DIR%' + sptJar + '" %*'
		if (commands.last() != launch) {
			problems << "run.bat's last command is not ${launch}: ${commands.last()}"
		}

		if (problems) {
			throw new GradleException('The launchers differ from the SPT image (cases under ' + workRoot + '):\n  ' +
				problems.join('\n  '))
		}
	}
}

// Extension JARs load through ParentLastURLClassLoader, which looks in them before the engine.
// A library bundled in one is what extension code gets at run time, so a stale copy is live.
tasks.register('verifyExtensionJarContents') {
	group = 'verification'
	description = 'Checks that load-step JARs carry only SPT classes and that bundled Jackson matches the engine'
	dependsOn assembleDist
	def extDir = file("${distDir}/ext")
	inputs.dir(extDir)
	def jacksonVersion = libs.versions.jacksonCore.get()
	doLast {
		// PackageVersion holds its version as one constant-pool string: tag 1, a two-byte length, then the
		// bytes. Matching all three keeps 2.22.30 or 2.22.3-SNAPSHOT from passing for 2.22.3.
		def versionConstant = new String(
			[1, jacksonVersion.length() >> 8, jacksonVersion.length() & 0xff] as byte[], 'ISO-8859-1') + jacksonVersion
		def problems = []
		def jars = (extDir.listFiles() ?: []).findAll { it.name.endsWith('.jar') }.sort { it.name }
		if (jars.isEmpty()) {
			throw new GradleException("No extension JARs under ${extDir}")
		}
		jars.each { jar ->
			new java.util.zip.ZipFile(jar).withCloseable { zip ->
				if (jar.name ==~ /(mixed|pipeline|weighted)-.+-all\.jar/) {
					def foreign = new TreeSet<String>()
					zip.entries().each { entry ->
						// A multi-release JAR's META-INF/versions/<n>/ classes load like top-level ones.
						def name = entry.name.replaceFirst('^META-INF/versions/[0-9]+/', '')
						if (name.endsWith('.class') && !name.startsWith('com/dell/spt/') && !name.startsWith('META-INF/')) {
							def slash = name.lastIndexOf('/')
							foreign << (slash < 0 ? name : name.substring(0, slash).tokenize('/').take(3).join('/'))
						}
					}
					if (foreign) {
						problems << "${jar.name} bundles classes the engine provides: ${foreign.take(6).join(', ')}"
					}
				}
				['com/fasterxml/jackson/core/json/PackageVersion.class',
					'com/fasterxml/jackson/databind/cfg/PackageVersion.class'].each { name ->
					def entry = zip.getEntry(name)
					if (entry != null && !new String(zip.getInputStream(entry).bytes, 'ISO-8859-1').contains(versionConstant)) {
						problems << "${jar.name} bundles a Jackson other than the engine's ${jacksonVersion} (${name})"
					}
				}
			}
		}
		if (problems) {
			throw new GradleException('Extension JAR contents:\n  ' + problems.join('\n  '))
		}
	}
}

// Hadoop's Configuration, created for every s3-tables Parquet file, parses core-default.xml when the
// thread's context loader can see it, and that needs Hadoop's shaded Guava. Write through the
// packaged JARs and the engine's extension loader, with the engine's and then the extension
// loader as context loader.
tasks.register('verifyS3TablesParquetWrite') {
	group = 'verification'
	description = 'Writes a Parquet file through the packaged s3-tables extension'
	dependsOn assembleDist
	def canarySource = layout.projectDirectory.file('src/canary/S3TablesParquetWriteCanary.java')
	inputs.file(canarySource)
	inputs.file(file("${distDir}/${sptJar}"))
	inputs.dir(file("${distDir}/ext"))
	doLast {
		def javaExecutable = new File(
			System.getProperty('java.home'),
			'bin/java' + (System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : '')
		).absolutePath
		def execution = providers.exec {
			commandLine javaExecutable, '-cp', "${distDir}/${sptJar}", canarySource.asFile.absolutePath, "${distDir}/ext"
			ignoreExitValue = true
		}
		def result = execution.result.get()
		def output = execution.standardOutput.asText.get() + execution.standardError.asText.get()
		if (result.exitValue != 0 || !output.contains('S3_TABLES_PARQUET_WRITE_OK')) {
			throw new GradleException("Packaged s3-tables Parquet write failed (exit ${result.exitValue}):\n${output}")
		}
	}
}

tasks.register('test') {
	group = 'verification'
	description = 'Runs bundle-level tests'
	dependsOn tasks.named('verifyDirectJarScenarioConfigs'),
		tasks.named('verifyExtensionJarContents'),
		tasks.named('verifyS3TablesParquetWrite'),
		tasks.named('verifyImageMallocTunable'),
		tasks.named('verifyLauncherJavaOptions'),
		tasks.named('verifyEngineBuildInfoCanary'),
		tasks.named('verifyEngineBuildInfoDocumentation')
}

check.dependsOn tasks.named('test')

// Main build task
build {
	dependsOn assembleDist, createRunScript, distZip
}

// Clean task
clean {
	delete distDir
	delete "${buildDir}/distributions"
}

spotless {
	java {
		target "**/*.java"
		endWithNewline()
		removeUnusedImports()
		eclipse().configFile rootProject.file("core/spt-base/spotless.eclipseformat.xml")
	}
}

// Docker configuration
import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage
import com.bmuschko.gradle.docker.tasks.image.DockerPushImage
import com.bmuschko.gradle.docker.tasks.image.Dockerfile

ext {
	// Docker registry configuration with override support
	// Default: GitHub Container Registry (ghcr.io/dell/storage-performance-tool)
	dockerRegistry = project.findProperty('dockerRegistry')
		?: System.getenv('DOCKER_REGISTRY')
		?: "ghcr.io"
	dockerNamespace = project.findProperty('dockerNamespace')
		?: System.getenv('DOCKER_NAMESPACE')
		?: "dell"
	def dockerImageOverride = project.findProperty('dockerImageName') ?: System.getenv('DOCKER_IMAGE')
	dockerImageName = dockerImageOverride ?: "${dockerRegistry}/${dockerNamespace}/storage-performance-tool"
	dockerImageTag = project.findProperty('dockerImageTag')
		?: System.getenv('DOCKER_TAG')
		?: project.version
	dockerImageFullName = "${dockerImageName}:${dockerImageTag}"
}

// Task to build Docker image
task dockerBuildImage(type: DockerBuildImage) {
    group = 'docker'
    description = 'Builds the Spt Docker image'

    dependsOn assembleDist, copyScenarios

    inputDir = projectDir
    images.add(dockerImageFullName)

    // Also tag as latest for SNAPSHOT versions
    if (project.version.toString().endsWith('-SNAPSHOT')) {
        images.add("${dockerImageName}:latest")
    }

    // Resolve base image overrides at configuration time and set build arg once
    // Sources (in order): -PbaseImage, BASE_IMAGE env
    // If no override is provided, defer to the Dockerfile's ARG default
    def envBase = System.getenv('BASE_IMAGE')
    def propBase = project.findProperty('baseImage') as String
    def baseImageOverride = propBase ?: envBase
    def args = [
        SPT_VERSION: sptVersion,
        SPT_RELEASE_VERSION: sptReleaseVersion
    ]
    if (baseImageOverride) {
        args.BASE_IMAGE = baseImageOverride
    }
    buildArgs.set(args)

    doFirst {
        // Ensure the distribution is built
        if (!file("${distDir}/spt.jar").exists()) {
            throw new GradleException("Distribution not found. Run 'gradle :bundle:assembleDist' first.")
        }
        println "Building Docker image: ${dockerImageFullName}"
        if (baseImageOverride) {
            println "Using base image override: ${baseImageOverride}"
        } else {
            println "Using Dockerfile default base image"
        }
    }

    doLast {
        println "Docker image built successfully: ${dockerImageFullName}"
        if (project.version.toString().endsWith('-SNAPSHOT')) {
            println "Also tagged as: ${dockerImageName}:latest"
        }
    }
}

// Task to push Docker image to Dell registry
task dockerPushImage(type: DockerPushImage) {
	group = 'docker'
	description = 'Pushes the Spt Docker image to Dell internal registry'
	
	dependsOn dockerBuildImage
	
	images.add(dockerImageFullName)
	
	// Also push latest tag for SNAPSHOT versions
	if (project.version.toString().endsWith('-SNAPSHOT')) {
		images.add("${dockerImageName}:latest")
	}
	
	doFirst {
		println "Pushing Docker image to Dell registry: ${dockerImageFullName}"
		println "Note: Ensure you are logged in to ${dockerRegistry} via 'docker login ${dockerRegistry}'"
	}
	
	doLast {
		println "Docker image pushed successfully: ${dockerImageFullName}"
		if (project.version.toString().endsWith('-SNAPSHOT')) {
			println "Also pushed: ${dockerImageName}:latest"
		}
	}
}

// Task to build testing image (with debug support)
task dockerBuildTestingImage(type: DockerBuildImage) {
	group = 'docker'
	description = 'Builds the Spt testing Docker image with debug support'
	
	dependsOn assembleDist
	
	inputDir = projectDir
	dockerFile = file('docker/Dockerfile.testing')
	images.add("${dockerImageName}:testing")
	
	doFirst {
		// Create testing Dockerfile if it doesn't exist
		if (!dockerFile.exists()) {
			dockerFile.parentFile.mkdirs()
			dockerFile.text = """FROM ${dockerImageFullName}

# Enable Java debugging
ENV JAVA_OPTS="\$JAVA_OPTS -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

# Expose debug port
EXPOSE 5005
"""
		}
	}
}

// Convenience task to build all Docker images
task dockerBuildAll {
	group = 'docker'
	description = 'Builds all Spt Docker images'
	dependsOn dockerBuildImage, dockerBuildTestingImage
}
