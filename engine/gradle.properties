# Gradle performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC

# Configuration cache (Gradle 6.6+)
# Currently disabled due to compatibility issues in bundle module
# TODO: Fix bundle/build.gradle to be configuration cache compatible
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# Console output
org.gradle.console=auto

# Dependency verification
org.gradle.dependency.verification=lenient

# Disable deprecation warnings
org.gradle.warning.mode=none