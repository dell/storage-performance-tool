---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run.
item:
  data:
    dedupable: true
    input:
      compressibility: 0.0
      file: null
      layer:
        cache: 16
        heap: false
        size: 4MB
      seed: 7a42d9c483244167
    ranges:
      concat: null
      fixed: null
      random: 0
      threshold: 0
    size: 1MB
    verify: false
  input:
    file: null
    path: null
  naming:
    length: 12
    seed: "%{int64:xor(int64:reverse(time:millisSinceEpoch()), int64:reverseBytes(time:nanos()))}"
    prefix: null
    shards: 0
    radix: 36
    step: 1
    type: random
  output:
    file: null
    path: "%{date:format(\"yyyyMMdd.HHmmss.SSS\").format(date:from(time:millisSinceEpoch()))}"
  type: data

load:
  batch:
    size: 32768
  op:
    limit:
      count: 0
      fail:
        count: 100000
        rate: false
      rate: 0
      recycle: 1000000
    output:
      duplicates: false
    recycle:
      mode: false
      content:
        update: false
    retry: false
    # Max retry attempts per operation when retry is enabled, before it's counted as a
    # failure. Matches common S3-client SDK retry defaults (e.g. minio-go's MaxRetry=10) --
    # see LoadStepContextImpl's retryBackoffMillis for the accompanying backoff.
    retryLimit: 10
    shuffle: false
    type: create
    list:
      delimiter: null
      fetch_metadata: false
      include_versions: false
      max_keys: 1000
      sharding:
        # New delimiter-first sharding controls (safe defaults)
        mode: auto
        delimiters: "/-_."
        # Flat keys kept for CLI convenience; parser also accepts nested split.pages
        split_pages: 50
        split:
          log:
            rate: 1
          # Split threshold expressed in pages of 1000 keys
          pages: 50
        split_log_rate: 1
        # Soft cap on queued shards to prevent runaway memory usage
        queue_max: 10000000
        summary: false
    wait:
      finish: true
      limit: 30
  service:
    threads: 0
  step:
    id: null
    idAutoGenerated: false
    limit:
      size: 0
      time: 0
    node:
      addrs: []
      port: 1099

output:
  color: true
  metrics:
    average:
      aggregation:
        period: 100
      period: 10s
      persist: true
      table:
        header:
          period: 20
    summary:
      persist: true
    trace:
      persist: false
    threshold: 0
    timing:
      persist: false
    quantiles:
    - 0.25
    - 0.5
    - 0.75

run:
  id: 0
  comment: ""
  node: false
  port: 9999
  scenario: null
  version: 5.13.0

log:
  level: info

server:
  metrics:
    expose_fleet: true

api:
  linger:
    sec: 20

storage:
  auth:
    file: null
    secret: null
    token: null
    uid: null
  driver:
    limit:
      concurrency: 1
      multipart:
        objects: 0
        parts: 0
      queue:
        input: 1000000
    threads: 0
    type: dummy-mock
  integrity:
    algorithm: sha256
    input:
      expectedProducerId: ""
      provenance: none
    mode: none
  namespace: null
  net:
    node:
      slice: false

aliasing:
# common
- name: "noop"
  target: "load-op-type=noop"
- name: "debug"
  target: "log-level=debug"
- name: "create"
  target: "load-op-type=create"
- name: "read"
  target: "load-op-type=read"
- name: "update"
  target: "load-op-type=update"
- name: "delete"
  target: "load-op-type=delete"
- name: "list"
  target: "load-op-type=list"
- name: "load-op-list-sharding-split-log-rate"
  target: "load-op-list-sharding-split_log_rate"
- name: "load-op-list-sharding-split-log-sample"
  deprecated: true
  target: "load-op-list-sharding-split_log_rate"
- name: "load-op-list-sharding-split-pages"
  target: "load-op-list-sharding-split_pages"
- name: "list-accel"
  target: "load-op-list-sharding-mode"
- name: "atmos-subtenant"
  target: "storage-auth-token"
- name: "s3-input-bucket"
  target: "item-input-path"
- name: "s3-output-bucket"
  target: "item-output-path"
- name: "swift-input-container"
  target: "item-input-path"
- name: "swift-output-container"
