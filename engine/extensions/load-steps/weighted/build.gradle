plugins {
	id 'spt.java-extension'
	alias(libs.plugins.shadow)
}

version = "4.2.13"

ext {
	rootPkg = "com.dell.spt.load.step.weighted"
}

dependencies {
	// Provided by the engine's spt.jar, and ParentLastURLClassLoader sends these packages to it.
	// compileOnly keeps them out of the shadow JAR, together with the Jackson and SnakeYAML they
	// bring transitively, which the extension class loader would otherwise load ahead of the engine's.
	compileOnly(
		libs.confuse,
		libs.confuse.io.yaml,
		libs.java.commons,
		libs.log4j.api,
		libs.log4j.core,
	)

	// Testing utilities
	testImplementation(
		libs.mockito.core,
	)

	testRuntimeOnly(
		libs.commons.codec,
		libs.confuse.io.yaml,
		libs.disruptor,
		libs.netty.transport.native.epoll,
	)
}
