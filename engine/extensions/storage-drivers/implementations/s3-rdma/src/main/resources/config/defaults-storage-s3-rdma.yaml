---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run. Use
# the command line arguments either load step configurations in the scenario files instead.
storage:
  auth:
    version: 4
  checksum:
    enabled: false
    algorithm: md5
  object:
    fsAccess: false
    tagging:
      enabled: false
      tags: {}
    versioning: false
  rdma:
    enabled: true
    thresholdBytes: 1048576
    fallback: false
    device: auto
    localIp: ""
    logLevel: WARN
    timeoutMs: 30000
    allowMissingBytesHeader: false
    bufferPool: true
    copyThreads: 1
    # With a NIC set, what a short NIC Pool does: fail stops the step before any object operation,
    # warn runs on with per-operation buffers. Without a NIC set nothing reads it.
    poolShortfall: fail
