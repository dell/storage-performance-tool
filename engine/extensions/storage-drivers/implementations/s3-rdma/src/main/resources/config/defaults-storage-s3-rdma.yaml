---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run. Use
# the command line arguments either load step configurations in the scenario files instead.
storage:
  auth:
    version: 4
  checksum:
    enabled: false
    algorithm: md5
  object:
    fsAccess: false
    tagging:
      enabled: false
      tags: {}
    versioning: false
  rdma:
    enabled: true
    threshold: 1048576
    fallback: true
    device: auto
    localIp: ""
    logLevel: WARN
    timeoutMs: 30000
