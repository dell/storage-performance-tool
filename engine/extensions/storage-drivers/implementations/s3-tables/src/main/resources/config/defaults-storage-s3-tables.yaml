---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run. Use
# the command line arguments either load step configurations in the scenario files instead.
storage:
  auth:
    version: 4
  checksum:
    enabled: false
    algorithm: md5
  object:
    fsAccess: false
    tagging:
      enabled: false
      tags: {}
    versioning: false
  s3tables:
    controlPlaneEndpoint: ""
    bucket: "spt-tables"
    namespace: "default"
    tableName: "spt-bench"
    opMode: "tableWrite"
    targetFileSizeBytes: 67108864
    ingestFileSizeBytes: 102400
    totalIngestBytes: 1073741824
    commitFreqMs: 500
    compactionPollIntervalMs: 5000
    compactionPollTimeoutMs: 14400000
    compactionToleranceFactor: 1.1
    compactionStabilizationPolls: 2
    namespaceCount: 100
    tablesPerNamespace: 100
