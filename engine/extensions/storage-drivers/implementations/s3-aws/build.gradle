plugins {
	id 'spt.java-extension'
	alias(libs.plugins.shadow)
}

version = "0.1.0"

ext {
	rootPkg = "com.dell.spt.storage.driver.coop.aws.s3"
}

dependencies {
	// AWS SDK – extension-private, safe to bundle.
	// Exclude Netty and SLF4J globally: the s3-aws driver uses the Apache HTTP
	// client, not the Netty NIO client, and the AWS SDK BOM pulls in an older
	// Netty (4.1.x) that conflicts with the engine's own Netty (4.2.x).
	implementation(libs.aws.s3) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
		exclude group: 'io.netty'
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation(libs.aws.auth) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	implementation(libs.aws.regions) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	implementation(libs.aws.core) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	implementation(libs.aws.sts) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	implementation(libs.aws.http.client.spi) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	implementation(libs.aws.apache.client) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
		exclude group: 'io.netty'
	}
	implementation(libs.aws.sdk.core) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	implementation(libs.aws.utils) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	implementation(libs.aws.profiles) {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}

	// SPT framework APIs – provided by parent classloader
	compileOnly project(':core:spt-base')
	// SPT driver primitives – provided by parent classloader
	compileOnly(
		project(':extensions:storage-drivers:primitives:coop'),
		project(':extensions:storage-drivers:primitives:nio'),
	)

	// Configuration / schema framework (used by the extension class)
	compileOnly libs.confuse
	compileOnly libs.confuse.io.yaml

	// Shared logging API – do not bundle
	compileOnly 'org.slf4j:slf4j-api:1.7.36'

	// Tests
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
	testImplementation libs.mockito.core
}

shadowJar {
	// Preserve SPI registrations from dependencies + this module
	mergeServiceFiles()

	// Exclude SLF4J and other logging frameworks to prevent conflicts
	exclude('org/slf4j/**')
	exclude('ch/qos/logback/**')
	exclude('org/apache/log4j/**')
	exclude('org/apache/logging/**')

	// Exclude Netty classes — the AWS SDK's transitive netty-nio-client (4.1.x)
	// conflicts with the engine's own Netty (4.2.x). The s3-aws driver uses the
	// Apache HTTP client and does not need Netty.
	exclude('io/netty/**')

	// Never bundle SPT framework classes
	// exclude("com/dell/spt/**")

	archiveClassifier.set("all")
}
