plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

dependencies {
    // AWS SDK for S3
    implementation 'software.amazon.awssdk:s3:2.21.29'
    implementation 'software.amazon.awssdk:auth:2.21.29'
    implementation 'software.amazon.awssdk:regions:2.21.29'
    implementation 'software.amazon.awssdk:aws-core:2.21.29'
    implementation 'software.amazon.awssdk:sts:2.21.29'
    implementation 'software.amazon.awssdk:http-client-spi:2.21.29'
    implementation 'software.amazon.awssdk:apache-client:2.21.29'

    // SPT core dependencies as project dependencies
    implementation project(':core:spt-base')
    implementation project(':extensions:storage-drivers:primitives:coop')

    // Logging
    implementation 'org.slf4j:slf4j-api:1.7.36'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
