# Test classes run one after another, as before. The classes of the stalled-request integration
# tests wait on the retries of native clients for about thirty seconds each, so they opt in to
# running at the same time with @Execution(CONCURRENT), and their wall time is that of the slowest.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
