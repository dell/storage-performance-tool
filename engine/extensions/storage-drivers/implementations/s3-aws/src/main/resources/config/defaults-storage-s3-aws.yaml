---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run. Use
# the command line arguments either load step configurations in the scenario files instead.
storage:
  auth:
    version: 2
  checksum:
    enabled: false
    algorithm: md5
  object:
    fsAccess: false
    tagging:
      enabled: false
      tags: {}
    versioning: false
  crt:
    # Size threshold for small object classification
    smallObjectThresholdBytes: 65536      # 64KB

    # CRT performance parameters
    targetThroughputGbps: 10.0           # High target throughput
    minimumPartSizeBytes: 8388608        # 8MB - optimal part size
    maxConcurrency: 512                   # High concurrency for better performance
    maxConcurrentRequestStreams: 16       # Optimal connection utilization

    # Connection pool settings
    connectionTimeoutMs: 2000
    connectionAcquisitionTimeoutMs: 1000
    connectionMaxIdleTimeMs: 60000        # 60 seconds
    connectionTimeToLiveMs: 300000        # 5 minutes

    # Threading configuration
    useVirtualThreads: true

    # Buffer configuration
    readBufferSizeBytes: 8192             # 8KB
