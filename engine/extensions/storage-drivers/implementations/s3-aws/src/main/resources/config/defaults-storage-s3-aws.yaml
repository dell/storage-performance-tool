---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run. Use
# the command line arguments either load step configurations in the scenario files instead.
storage:
  auth:
    version: 2
  checksum:
    enabled: false
    algorithm: md5
  object:
    fsAccess: false
    tagging:
      enabled: false
      tags: {}
    versioning: false
  crt:
    targetThroughputGbps: 20.0
    minimumPartSizeBytes: 16777216
    # TCP connect deadline for every S3 client of the driver.
    connectionTimeoutMs: 5000
    # Idle timeout of a connection with a request in flight: 30 seconds, as for the Netty driver
    # (storage.net.timeoutMilliSec). A stalled request then fails and is counted instead of
    # holding its slot for the rest of the run. Raise it for operations that legitimately stay
    # silent for longer; 0 does not detect stalled requests.
    socketTimeoutMs: 30000
