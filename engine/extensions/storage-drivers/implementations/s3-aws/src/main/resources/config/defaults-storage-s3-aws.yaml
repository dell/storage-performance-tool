---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run. Use
# the command line arguments either load step configurations in the scenario files instead.
storage:
  auth:
    version: 2
  checksum:
    enabled: false
    algorithm: md5
  object:
    fsAccess: false
    tagging:
      enabled: false
      tags: {}
    versioning: false
  crt:
    # Size thresholds for object classification
    optimizeForSmallObjects: true
    smallObjectThresholdBytes: 65536      # 64KB
    mediumObjectThresholdBytes: 8388608   # 8MB
    largeObjectThresholdBytes: 104857600  # 100MB

    # CRT performance parameters (factory defaults used when optimizeForSmallObjects: true)
    targetThroughputGbps: 10.0           # High target for small object workloads
    minimumPartSizeBytes: 8388608        # 8MB - optimal for small objects
    maxConcurrency: 512                   # High concurrency for small objects
    maxConcurrentRequestStreams: 16       # Optimal value tested: better connection utilization

    # Connection pool settings
    connectionTimeoutMs: 2000
    connectionAcquisitionTimeoutMs: 1000
    connectionMaxIdleTimeMs: 60000        # 60 seconds
    connectionTimeToLiveMs: 300000        # 5 minutes

    # Threading configuration
    useVirtualThreads: true
    smallObjectThreadCount: 128

    # Buffer configuration
    byteBufferThresholdBytes: 65536       # 64KB
    readBufferSizeBytes: 8192             # 8KB

    # Adaptive tuning (enabled for performance optimization)
    enableAdaptiveTuning: true
    adaptiveTuningIntervalSeconds: 30
