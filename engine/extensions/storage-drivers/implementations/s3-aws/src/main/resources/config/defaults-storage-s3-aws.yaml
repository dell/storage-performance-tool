---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run. Use
# the command line arguments either load step configurations in the scenario files instead.
storage:
  auth:
    version: 2
  checksum:
    enabled: false
    algorithm: md5
  object:
    fsAccess: false
    tagging:
      enabled: false
      tags: {}
    versioning: false
  crt:
    targetThroughputGbps: 20.0
    minimumPartSizeBytes: 16777216
    # TCP connect deadline for every S3 client of the driver.
    connectionTimeoutMs: 5000
    # Idle timeout of a connection with a request in flight: 30 seconds, as for the Netty driver
    # (storage.net.timeoutMilliSec). A stalled request then fails and is counted instead of
    # holding its slot for the rest of the run. Raise it for operations that legitimately stay
    # silent for longer; 0 does not detect stalled requests.
    socketTimeoutMs: 30000
    # Deadline of each request, from the moment the driver makes it: a request the client has
    # lost with no connection to watch fails as a timeout after 5 minutes instead of holding its
    # worker for the rest of the run. Raise it for requests that legitimately take longer (very
    # large single PUTs on slow links); 0 waits without bound.
    requestTimeoutMs: 300000
    # Requests still in flight once the step stops get 10 seconds, the engine's budget for stopping
    # a run, before the driver cancels them and counts them as interrupted; 0 leaves them to the
    # step's wait (load.op.wait.limit) and the stop of the workers.
    stopTimeoutMs: 10000
