---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run.
#
# The s3-aws driver reads most config from the standard storage paths shared
# with the netty driver (storage.auth.*, storage.net.node.*, storage.net.ssl.*).
# This schema only adds keys unique to s3-aws.
storage:
  driver:
    threads: int
  region: string
  auth:
    version: int
  checksum:
    enabled: boolean
    algorithm: string
  object:
    fsAccess: boolean
    tagging:
      enabled: boolean
      tags: map
    versioning: boolean
  crt:
    # Size thresholds for object classification
    optimizeForSmallObjects: boolean
    smallObjectThresholdBytes: long
    mediumObjectThresholdBytes: long
    largeObjectThresholdBytes: long

    # CRT performance parameters
    targetThroughputGbps: double
    minimumPartSizeBytes: long
    maxConcurrency: int
    maxConcurrentRequestStreams: int

    # Connection pool settings
    connectionTimeoutMs: int
    connectionAcquisitionTimeoutMs: int
    connectionMaxIdleTimeMs: int
    connectionTimeToLiveMs: int
    socketTimeoutMs: int

    # Threading configuration
    useVirtualThreads: boolean
    smallObjectThreadCount: int

    # Buffer configuration
    byteBufferThresholdBytes: long
    readBufferSizeBytes: int

    # Adaptive tuning
    enableAdaptiveTuning: boolean
    adaptiveTuningIntervalSeconds: long

    # Legacy parameters (kept for backward compatibility)
    partSizeBytes: long
