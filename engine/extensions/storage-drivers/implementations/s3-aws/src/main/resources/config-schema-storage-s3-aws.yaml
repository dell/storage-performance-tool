---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run.
#
# The s3-aws driver reads most config from the standard storage paths shared
# with the netty driver (storage.auth.*, storage.net.node.*, storage.net.ssl.*).
# This schema only adds keys unique to s3-aws.
storage:
  driver:
    threads: int
  region: string
  auth:
    version: int
  checksum:
    enabled: boolean
    algorithm: string
  object:
    fsAccess: boolean
    tagging:
      enabled: boolean
      tags: map
    versioning: boolean
  crt:
    targetThroughputGbps: double
    minimumPartSizeBytes: long
    maxConcurrency: int
    partSizeBytes: long
    smallObjectThresholdBytes: long
    optimizeForSmallObjects: boolean
    connectionTimeoutMs: int
    socketTimeoutMs: int
