---
# WARNING: Do not edit this file manually, it will be replaced with factory default content on every Spt run.
storage:
  # Legacy S3 authentication parameters (for backward compatibility)
  auth-uid: string
  auth-secret: string
  storage-auth-uid: string
  storage-auth-secret: string
  storage-auth-version: int
  
  # AWS-specific authentication parameters
  access-key: string
  secret-key: string
  region: string
  
  # Network configuration  
  storage-net-node-addrs: string
  
  # Endpoint configuration
  endpoint: string
  path-style-access: boolean
  storage-net-s3-path-style-access: boolean
  
  # Connection configuration
  max-connections: int
  socket-timeout-ms: int
  connection-timeout-ms: int
  
  # Legacy S3 configuration structure
  auth:
    version: int
  checksum:
    enabled: boolean
    algorithm: string
  object:
    fsAccess: boolean
    tagging:
      enabled: boolean
      tags: map
    versioning: boolean
