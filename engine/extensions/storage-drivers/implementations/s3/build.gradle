plugins {
	id 'spt.java-extension'
	alias(libs.plugins.shadow)
}

version = "4.2.23"

ext {
	rootPkg = "com.dell.spt.storage.driver.coop.netty.http.s3"
}

dependencies {
	// Local JARs in libs directory
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	
	// Storage driver dependencies
	// Inter-extension dependencies are compileOnly to prevent transitive bundling
	compileOnly(
		project(':extensions:storage-drivers:primitives:coop'),
		project(':extensions:storage-drivers:primitives:netty'),
		project(':extensions:storage-drivers:protocols:http'),
	)
	
	// API dependencies that must come from parent classloader
	compileOnly(
		libs.confuse,
		libs.confuse.io.yaml,
		libs.java.commons,
		libs.netty.connection.pool,
		libs.log4j.api,
		libs.log4j.core,
	)
	
	// External dependencies that will be bundled
	implementation(
		libs.netty.handler,
		libs.netty.codec.http,
		libs.aws.crt,
	)

	testImplementation(libs.mockito.core)

	testRuntimeOnly(
		libs.commons.codec,
		libs.confuse.io.yaml,
		libs.disruptor,
		libs.netty.transport.native.epoll,
	)
}

// S3-specific comment configuration (preserved from original)
// Code Formatting /////////////////////////////////////////////////////////////////////////////////////////////////////

// Wire encodings must not depend on the JVM's host charset. Run in a fresh JVM
// because Charset.defaultCharset() is initialized before any individual test.
def wireEncodingTest = tasks.register('wireEncodingTest', Test) {
	group = 'verification'
	description = 'Verify S3 wire bytes with a non-UTF-8 default charset'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/S3WireEncodingTest.class'
	jvmArgs '-Dfile.encoding=ISO-8859-1'
	systemProperty 'spt.test.expectedCharset', 'ISO-8859-1'
}
tasks.named('test') {
	dependsOn wireEncodingTest
}
