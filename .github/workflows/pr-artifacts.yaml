---
name: PR Build Artifacts

'on':
  pull_request:
    branches: ["**"]
    paths:
      - 'cli/**'
      - 'engine/**'
      - '.github/workflows/pr-artifacts.yaml'
  workflow_dispatch:

concurrency:
  group: pr-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-binaries:
    name: Build CLI Binaries (matrix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build all targets
        if: ${{ !env.ACT }}
        run: make -C cli build-all

      - name: Upload CLI binaries
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries-${{ github.sha }}
          path: cli/build/*

  engine-bundle:
    name: Build Engine Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 21 for act
        if: ${{ env.ACT }}
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            -y \
            --no-install-recommends \
            openjdk-21-jdk \
            ca-certificates
          java -version

      - name: Set up Java 21 (Temurin)
        if: ${{ !env.ACT }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Spotless check
        working-directory: engine
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Build bundle
        working-directory: engine
        run: ./gradlew :bundle:build --no-daemon --stacktrace

      - name: Upload engine bundle artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-bundle-${{ github.sha }}
          path: |
            engine/bundle/build/dist/**/*
            !engine/bundle/build/dist/**/*.md5
            !engine/bundle/build/dist/**/*.sha*
