---
name: Engine CI

'on':
  pull_request:
    branches: ["**"]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-ci.yaml'
  workflow_dispatch:

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-build-test:
    name: Build and Test (Gradle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 21 for act
        if: ${{ env.ACT }}
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            -y \
            --no-install-recommends \
            openjdk-21-jdk \
            ca-certificates
          java -version

      - name: Set up Java 21 (Temurin)
        if: ${{ !env.ACT }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Spotless check
        working-directory: engine
        run: |
          ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Gradle build and tests
        working-directory: engine
        run: |
          ./gradlew --version
          ./gradlew clean test jacocoRootReport build :bundle:build \
            --no-daemon \
            --stacktrace

      - name: Upload reports (always)
        if: ${{ !env.ACT && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            engine/**/build/reports/tests/**/*
            engine/**/build/reports/jacoco/**/*
