---
name: Release Gobrick
# Invocable as a reusable workflow
# Can be manually triggered
on:  # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:
    inputs:
      option:
        description: "Select version to release"
        required: true
        type: choice
        default: "minor"
        options:
          - major
          - minor
          - patch
          - n-1/n-2 patch (Provide input in the below box)
      version:
        description: >
          Patch version to release. example: 2.1.x
          (Use this only if n-1/n-2 patch is selected)
        required: false
        type: string
  repository_dispatch:
    types: [release-go-libs]
jobs:
  process-inputs:
    name: Process Inputs
    runs-on: ubuntu-latest
    outputs:
      processedVersion: ${{ steps.set-version.outputs.versionEnv }}
    steps:
      - name: Process input
        id: set-version
        shell: bash
        run: |
          option_value="n-1/n-2 patch (Provide input in the below box)"
          if [[ "${{ github.event.inputs.version }}" != "" && \
            "${{ github.event.inputs.option }}" == "$option_value" ]]; then
            # If both version and option are provided, version takes precedence
            # i.e. patch release for n-1/n-2.
            version_input="${{ github.event.inputs.version }}"
            echo "versionEnv=${version_input}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.inputs.option }}" != "$option_value" ]]; then
            # If only option is provided, it takes precedence
            # i.e. minor, major or patch release.
            option_input="${{ github.event.inputs.option }}"
            echo "versionEnv=${option_input}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If neither option nor version is provided,
          # then minor release is taken by default (Auto-release).
          echo "versionEnv=minor" >> $GITHUB_OUTPUT

  # This job updates the commits of the dependent libraries
  # for the Gobrick library
  package-update:
    uses: dell/common-github-actions/.github/workflows/update-libraries.yml@main  # yamllint disable-line rule:line-length
    name: Dell Libraries Update
    secrets: inherit

  csm-release:
    needs: [package-update, process-inputs]
    uses: dell/common-github-actions/.github/workflows/csm-release-libs.yaml@main  # yamllint disable-line rule:line-length
    name: Release Go Client Libraries
    with:
      version: "${{ needs.process-inputs.outputs.processedVersion }}"
    secrets: inherit
