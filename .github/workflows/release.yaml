---
name: Release CSM
# Invocable as a reusable workflow
# Can be manually triggered
on:  # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:
    inputs:
      option:
        description: >
          Choose which semantic versioning increment to apply to the release.
          Options: "major", "minor", or "patch".
          Example: Choosing "minor" will increment the minor version number and
          release new images. Choosing "patch" for an n-1/n-2 release will not
          release any images; that should be done manually.
        required: true
        type: choice
        default: 'minor'
        options:
          - major
          - minor
          - patch
          - n-1/n-2 patch (Provide input in the below box)
      version:
        description: >
          Patch version to release. example: 2.1.x
          (Use this only if n-1/n-2 patch is selected)
        required: false
        type: string
  repository_dispatch:
    types: [auto-release-workflow]

jobs:
  process-inputs:
    name: Process Inputs
    runs-on: ubuntu-latest
    outputs:
      processedVersion: ${{ steps.set-version.outputs.versionEnv }}
    steps:
      - name: Process input
        id: set-version
        shell: bash
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          option_value="n-1/n-2 patch (Provide input in the below box)"
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "versionEnv=minor" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "${{ github.event.inputs.version }}" != "" && \
            "${{ github.event.inputs.option }}" == "$option_value" ]]; then
            # If both version and option are provided, version takes precedence
            # i.e. patch release for n-1/n-2.
            version_input="${{ github.event.inputs.version }}"
            echo "versionEnv=${version_input}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.inputs.option }}" != "$option_value" ]]; then
            # If only option is provided, it takes precedence
            # i.e. minor, major or patch release.
            option_input="${{ github.event.inputs.option }}"
            echo "versionEnv=${option_input}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If neither option nor version is provided,
          # then minor release is taken by default (Auto-release).
          echo "versionEnv=minor" >> $GITHUB_OUTPUT
  csm-release:
    needs: [process-inputs]
    uses: dell/common-github-actions/.github/workflows/csm-release-driver-module.yaml@main  # yamllint disable-line rule:line-length
    name: Release CSM Drivers and Modules
    with:
      version: ${{ needs.process-inputs.outputs.processedVersion }}
      images: 'FILL IN IMAGE NAME HERE'
    secrets: inherit
