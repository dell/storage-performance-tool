# Reusable workflow to update Dell client libraries
# to the latest commits
---
name: Dell Libraries Commit Update
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  repository_dispatch:
    types: [latest-commits-libraries]

jobs:
  package-update:
    uses: dell/common-github-actions/.github/workflows/update-libraries-to-commits.yml@main  # yamllint disable-line rule:line-length
    name: Dell Libraries Update
    secrets: inherit
